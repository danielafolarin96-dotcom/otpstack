name: Expire pending orders

# Vercel's Hobby plan only allows cron jobs to run once per day, which is far
# too infrequent for a 10-minute order TTL (see ARCHITECTURE.md's order
# lifecycle step 5, and app/api/cron/expire-orders/route.ts's own comment).
# This workflow calls that same endpoint on a tighter schedule so abandoned
# orders (no SMS, user closed the tab) get refunded close to on time instead
# of waiting for the dashboard's own poll-triggered fallback or the daily
# Vercel cron sweep.
#
# Confirmed money-losing bug (Sept 2026, see that commit's message): while
# this was the once-a-day Vercel cron alone, the expire sweep ran so late
# relative to 5sim's own ~5-minute no-SMS timeout (5sim docs: "Timeout no
# sms 5 minute") that cancelOrder() upstream almost always failed, so 5sim
# kept the money while we still refunded the customer. This workflow
# closes most of that gap, but GitHub Actions' scheduler has a documented
# 5-minute floor and is NOT guaranteed to fire on time — it can slip
# several minutes under load, which matters against a 10-minute TTL and a
# ~5-minute upstream cancel window. Treat this as a secondary/backstop
# trigger, not the primary one: pair it with a dedicated external pinger
# (Upstash QStash recommended — see that commit message for why) hitting
# the same endpoint on a tighter, more reliable schedule.
#
# Requires a repository secret CRON_SECRET with the exact same value as the
# CRON_SECRET environment variable already set in the Vercel project ---
# Settings > Secrets and variables > Actions > New repository secret.

on:
  schedule:
    # GitHub's documented floor is 5 minutes -- "*/1" or "*/2" are silently
    # unsupported, so this is as tight as this trigger can go. See the
    # comment above: a dedicated external pinger is the primary mechanism,
    # this is the backstop.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  expire-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Call expire-orders cron endpoint
        run: |
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X GET "https://otpstack.com.ng/api/cron/expire-orders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "expire-orders call failed with status $status"
            exit 1
          fi
